<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Flip Predictor (Hash + Client Seed)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace, sans-serif; }
        body { background: #06080d; color: #f8fafc; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 16px; }
        .card { background: #0f141f; border: 1px solid #1e293b; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
        .card.border-glow { border: 2px solid #8b5cf6; background: linear-gradient(180deg, rgba(139, 92, 246, 0.12) 0%, #0f141f 100%); }
        label { font-size: 0.76rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; display: block; font-weight: bold; }
        input { width: 100%; background: #080b10; border: 1px solid #1e293b; color: #f8fafc; padding: 11px 14px; border-radius: 8px; font-size: 0.9rem; outline: none; }
        input:focus { border-color: #8b5cf6; }
        button { background: #3b82f6; color: white; border: none; padding: 11px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
        button:hover { background: #2563eb; }
        .btn-group { display: flex; gap: 10px; }
        .btn-group button { flex: 1; }
        .stat-box { background: #080b10; border: 1px solid #1e293b; padding: 12px; border-radius: 8px; text-align: center; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
        .stat-val { font-size: 1.8rem; font-weight: bold; color: #fff; }
        .stat-sub { font-size: 0.7rem; color: #94a3b8; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        #coinFlipAnim { margin-top: 14px; height: 100px; display: flex; align-items: center; justify-content: center; font-size: 3.5rem; font-weight: bold; text-align: center; color: #fff; text-shadow: 0 0 20px rgba(255,255,255,0.3); border: 2px dashed #334155; border-radius: 12px; background: #080b10; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 10px; }
        th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid #1e293b; }
        th { color: #94a3b8; font-weight: normal; font-size: 0.72rem; text-transform: uppercase; }
        .hint { font-size: 0.82rem; color: #94a3b8; margin-top: 6px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card border-glow">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <label style="color: #c084fc; font-size: 0.9rem;">🪙 PROVABLY FAIR COIN FLIP PREDICTOR</label>
            <span style="font-size: 0.75rem; color: #38bdf8; font-weight: bold;">HMAC-SHA256 Deterministic</span>
        </div>
        <p class="hint">Derives HEADS or TAILS from HMAC-SHA256(serverSeed, clientSeed:nonce). First bit of the digest decides the flip.</p>

        <div class="grid-3">
            <div class="stat-box" style="border-color: #f87171; background: rgba(239, 68, 68, 0.08);">
                <label style="color: #f87171;">HEADS PROBABILITY</label>
                <div id="coinHeadsVal" class="stat-val" style="color: #f87171;">50.0%</div>
                <div class="stat-sub">Derived HMAC match weight</div>
            </div>
            <div class="stat-box" style="border-color: #38bdf8; background: rgba(56, 189, 248, 0.08);">
                <label style="color: #38bdf8;">TAILS PROBABILITY</label>
                <div id="coinTailsVal" class="stat-val" style="color: #38bdf8;">50.0%</div>
                <div class="stat-sub">Derived HMAC match weight</div>
            </div>
            <div class="stat-box" style="border-color: #8b5cf6; background: rgba(139, 92, 246, 0.12);">
                <label style="color: #8b5cf6;">PREDICTED FLIP</label>
                <div id="coinPredictedVal" class="stat-val" style="color: #fff; text-shadow: 0 0 15px rgba(255,255,255,0.5);">--</div>
                <div class="stat-sub">Exact deterministic signal</div>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; background: #080b10; padding: 8px 12px; border-radius: 6px; border: 1px solid #1e293b; margin-top: 10px;">
            <div style="font-size: 0.78rem; color: #94a3b8;">Flip Nonce: <span id="coinNonceLabel">0</span></div>
            <button onclick="advanceCoinNonce()" style="width: auto; background: linear-gradient(90deg, #10b981, #059669);">⚡ Flip Next Nonce</button>
        </div>

        <div id="coinFlipAnim">--</div>

        <table>
            <thead>
                <tr>
                    <th>Nonce</th>
                    <th>Result</th>
                    <th>Hex Digest (first 8)</th>
                    <th>Bit 0</th>
                </tr>
            </thead>
            <tbody id="coinHistoryTable"></tbody>
        </table>
    </div>

    <div class="card">
        <label>Hashed Server Seed Commitment (SHA-256 Hash)</label>
        <input type="text" id="serverSeed" value="e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855" oninput="runCoinFlipPredictor()">

        <label>Client Seed</label>
        <input type="text" id="clientSeed" value="coin_client_master_entropy" oninput="runCoinFlipPredictor()">

        <label>Casino Algorithm Mode</label>
        <select id="casinoMode" onchange="runCoinFlipPredictor()">
            <option value="betpanda" selected>BetPanda.io (clientSeed:nonce:serverSeed)</option>
            <option value="stake">Stake / Standard (clientSeed:nonce)</option>
            <option value="betfury">BetFury / BC.Game (serverSeed:clientSeed:nonce)</option>
            <option value="roobet">Roobet (clientSeed:nonce:0)</option>
            <option value="bustabit">Bustabit (clientSeed:nonce:serverSeed)</option>
        </select>

        <label>Nonce Counter (Flip Index)</label>
        <div class="btn-group">
            <input type="number" id="nonce" value="0" min="0" oninput="runCoinFlipPredictor()">
            <button onclick="adjustCoinNonce(-1)" style="width: auto;">-1</button>
            <button onclick="adjustCoinNonce(1)" style="width: auto;">+1</button>
        </div>
    </div>
</div>

<script>
let coinHistory = [];

async function deriveCoinFlip(serverSeed, clientSeed, nonce, casinoMode) {
    const enc = new TextEncoder();
    const keyData = enc.encode(serverSeed || 'default_server_seed');
    let msgStr;
    switch (casinoMode) {
        case 'betpanda':
        case 'bustabit':
            msgStr = `${clientSeed}:${nonce}:${serverSeed}`;
            break;
        case 'betfury':
            msgStr = `${serverSeed}:${clientSeed}:${nonce}`;
            break;
        case 'roobet':
            msgStr = `${clientSeed}:${nonce}:0`;
            break;
        case 'stake':
        default:
            msgStr = `${clientSeed}:${nonce}`;
    }
    const msgData = enc.encode(msgStr);
    const cryptoKey = await crypto.subtle.importKey('raw', keyData, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
    const sig = await crypto.subtle.sign('HMAC', cryptoKey, msgData);
    const buf = new Uint8Array(sig);
    const bit0 = (buf[0] >> 7) & 1;
    const result = bit0 === 1 ? 'HEADS' : 'TAILS';
    return { nonce, result, bit0, hexChunk: Array.from(buf.slice(0, 8)).map(b => b.toString(16).padStart(2, '0')).join('') };
}

async function runCoinFlipPredictor() {
    const serverSeed = document.getElementById('serverSeed').value || 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855';
    const clientSeed = document.getElementById('clientSeed').value || 'coin_client_master_entropy';
    const nonce = parseInt(document.getElementById('nonce').value) || 0;
    const casinoMode = document.getElementById('casinoMode').value;

    try {
        const flip = await deriveCoinFlip(serverSeed, clientSeed, nonce, casinoMode);

        document.getElementById('coinNonceLabel').innerText = nonce;
        document.getElementById('coinHeadsVal').innerText = flip.result === 'HEADS' ? '100.0%' : '0.0%';
        document.getElementById('coinTailsVal').innerText = flip.result === 'TAILS' ? '100.0%' : '0.0%';

        const predElem = document.getElementById('coinPredictedVal');
        predElem.innerText = flip.result;
        predElem.style.color = flip.result === 'HEADS' ? '#f87171' : '#38bdf8';
        predElem.style.textShadow = flip.result === 'HEADS' ? '0 0 15px rgba(239, 68, 68, 0.6)' : '0 0 15px rgba(56, 189, 248, 0.6)';

        const anim = document.getElementById('coinFlipAnim');
        anim.innerText = flip.result === 'HEADS' ? 'HEADS' : 'TAILS';
        anim.style.color = flip.result === 'HEADS' ? '#f87171' : '#38bdf8';

        coinHistory.unshift(flip);
        if (coinHistory.length > 50) coinHistory.pop();
        renderCoinHistory();
    } catch (err) {
        console.error('Coin Flip Predictor Error:', err);
    }
}

function renderCoinHistory() {
    const tbody = document.getElementById('coinHistoryTable');
    if (!tbody) return;
    tbody.innerHTML = '';
    coinHistory.forEach(item => {
        const tr = document.createElement('tr');
        const colorStyle = item.result === 'HEADS' ? 'color: #f87171; font-weight: bold;' : 'color: #38bdf8; font-weight: bold;';
        tr.innerHTML = `
            <td style="font-size: 0.75rem; color: #94a3b8;">#${item.nonce}</td>
            <td style="${colorStyle}">${item.result}</td>
            <td style="font-size: 0.7rem; color: #94a3b8;">${item.hexChunk}</td>
            <td style="font-size: 0.75rem; color: #38bdf8; font-weight: bold;">${item.bit0}</td>
        `;
        tbody.appendChild(tr);
    });
}

function advanceCoinNonce() {
    const input = document.getElementById('nonce');
    let val = parseInt(input.value) || 0;
    val = Math.max(0, val + 1);
    input.value = val;
    runCoinFlipPredictor();
}

function adjustCoinNonce(delta) {
    const input = document.getElementById('nonce');
    let val = parseInt(input.value) || 0;
    val = Math.max(0, val + delta);
    input.value = val;
    runCoinFlipPredictor();
}

document.addEventListener('DOMContentLoaded', () => {
    runCoinFlipPredictor();
});
</script>

</body>
</html>
